# Camera Cluster feed: settings for the waze-on-cluster render program
# (robertnisipeanu/idrive-apps, GPL-3.0-or-later, shipped unchanged) so that it
# decodes the car's camera stream instead of a phone's map and hands the
# picture to Cluster renderer for the cluster's centre map area.
#
# Only the keys that differ from that program's built-in defaults are here.
# Every path is this tool's own, so it never reads or writes the files of a
# Waze on cluster installation on the same head unit.
#
# Your own changes go in local_conf (kept over updates), one "key = value" a line.
local_conf = /var/opt/camera-cluster-feed/camera-feed.local.conf

# --- control socket (the Camera Cluster app) ---------------------------------
# systemd makes and passes this socket (camera-cluster-feed.socket); the values
# here only matter when the program is started by hand.
socket_path = /dev/shm/camera-cluster-feed/ctl.sock
socket_mode = 0660
socket_group = tm_oap_app

# --- log ----------------------------------------------------------------------
log_file = /var/opt/camera-cluster-feed/log/camera-feed.log
log_file_kb = 256

# --- where the video comes from ----------------------------------------------
# The camera unit's stream on the head unit's media bus. In the owner's iDrive 7
# firmware image, BMW's own camera display (dasvideo) and camera service
# (icam2proxy) both name this stream, and the bus library has the receiver
# functions this program calls. Not yet seen running on the car.
avb_stream = media_transport.avb_streaming.1
# The program also listens on a FIFO and a UDP port (its other capture modes).
# Nothing writes to them here; they are only moved off Waze on cluster's own.
fifo_path = /run/camera-cluster-feed/unused.h264
udp_port = 20559

# --- the picture ----------------------------------------------------------------
# The whole camera picture, stretched to the map area (1088x480). The camera's
# picture size on this car is not known yet, so it is not cropped. Once the log
# shows it ("SPS from avb: ... WxH"), set these two in local_conf to keep its
# shape, for example for a 1280x720 picture:
#   map_rect = 118,0,852,480
src_crop =
map_rect =
tex_size = 1088x480
# 15 pictures a second: about half the upload of a phone's map.
target_fps = 15
picture_fps = 15

# --- when it shows ----------------------------------------------------------------
# Off until the app turns it on; the app turns it on only while the camera unit
# confirms the chosen view.
cluster = 0
hud = 0
target = map
# BMW's own turn-by-turn box stays visible on the cluster.
hide_bmw_guidance = 0
state_file = /var/opt/camera-cluster-feed/state/guide.state.conf
map_state_file = /var/opt/camera-cluster-feed/state/map.state.conf
# There is no phone connection to watch: the stream is live while pictures
# arrive, and the cluster's own map is back 3 s after they stop.
alt_screen_port = 0
stall_ms = 3000
# A camera at night is dark, not "blank" or "frozen": those checks are for a
# phone's map and stay out of the way.
freeze_ms = 0
blank_ms = 600000
